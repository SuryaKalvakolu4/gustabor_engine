version: '3.9'

services:
  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    container_name: gustabor_backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: your_openai_key_here
    volumes:
      - ../gustabor_backend:/app
      - ../data:/app/data
