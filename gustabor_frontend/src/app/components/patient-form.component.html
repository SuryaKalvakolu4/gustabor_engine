<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div *ngFor="let taste of ['sweet','sour','bitter','salty','umami']">
    <label>{{taste}}</label>
    <input type="range" min="0" max="1" step="0.01" formControlName="{{taste}}" />
    {{ form.value[taste] }}
  </div>
  <label>Dislikes (comma separated)</label>
  <input formControlName="dislikes" />
  <button type="submit">Submit Profile</button>
  <div *ngIf="profileId">Your profile ID: {{profileId}}</div>
</form>
